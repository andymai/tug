# Tug is Linux-first. Scoping the graph keeps Windows- and macOS-only
# transitive crates (and their licenses) out of the checks.
[graph]
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[advisories]
ignore = []
unmaintained = "workspace"
yanked = "warn"

[licenses]
# MPL-2.0 enters through dirs' option-ext (the default download folder), as in hush.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

# MDM's crates come from its repository at one pinned commit, and they pull
# craft-atomic from storytold's craft-libs. Nothing else may come from git.
[sources]
allow-git = [
  "https://github.com/anefzaoui/misterdownloadmanager",
  "https://github.com/storytold/craft-libs",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
