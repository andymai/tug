# Advisories that OSV reports for crates Tug cannot drop yet. Each entry
# names the change that removes the crate; delete the entry with that change.

# gtk-rs 0.18 (GTK3) is Tauri 2's Linux stack: tauri, tao, muda and
# webkit2gtk 2.0 all depend on it. Both leave when Tauri moves to GTK4.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "unmaintained proc-macro-error via glib-macros 0.18 in Tauri 2's GTK3 stack; removed when Tauri moves to GTK4"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "unsound glib 0.18 VariantStrIter, which Tug never calls, in Tauri 2's GTK3 stack; removed when Tauri moves to GTK4"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-01
# Needs an attacker-supplied glob compiled with optimizationLevel >= 2: the
# globParts amplification and the quadratic pairwise pass both run only behind
# that check in minimatch's preprocess(). Its two consumers here,
# @eslint/config-array and @typescript-eslint/typescript-estree, never pass
# optimizationLevel, and the tree has no glob package (glob 9+ sets it). Every
# glob they compile comes from config authored in this repo.
reason = "dev-only lint tooling; no consumer sets optimizationLevel >= 2, the only path that amplifies globParts; globs are repo-authored"

# tauri-plugin-opener 2.x reveals files on Linux through zbus 5 (it asks for
# zbus ^5.9). zbus 6 took these crates in as modules, so their standalone
# releases are unmaintained. All three leave when the plugin moves to zbus 6.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "unmaintained zvariant, merged into zbus 6; via zbus 5 in tauri-plugin-opener 2.x; removed when the plugin moves to zbus 6"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "unmaintained zbus_names, merged into zbus 6; via zbus 5 in tauri-plugin-opener 2.x; removed when the plugin moves to zbus 6"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "unmaintained zvariant_derive, merged into zbus 6; via zbus 5 in tauri-plugin-opener 2.x; removed when the plugin moves to zbus 6"
