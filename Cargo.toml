[workspace]
members = ["apps/desktop/src-tauri", "crates/tug-core", "crates/tug-host", "crates/tug-ipc"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/andymai/tug"
rust-version = "1.95"
version = "0.19.1"

[workspace.dependencies]
ashpd = {version = "0.13", default-features = false, features = [
  "file_chooser",
  "settings",
  "tokio",
]}
dirs = "6"
futures-util = {version = "0.3", default-features = false}
http = "1"
ksni = "0.3"
mdm-engine = {git = "https://github.com/anefzaoui/misterdownloadmanager", rev = "8d2c73fcc33534c002631466b7e10db52796738b"}
mdm-labserver = {git = "https://github.com/anefzaoui/misterdownloadmanager", rev = "8d2c73fcc33534c002631466b7e10db52796738b"}
rusqlite = {version = "0.41", features = ["bundled"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2.7"
tempfile = "3"
thiserror = "2"
tokio = {version = "1", features = ["macros", "rt-multi-thread", "sync", "time"]}
ts-rs = "12"
tug-core = {path = "crates/tug-core"}
tug-ipc = {path = "crates/tug-ipc"}
url = "2"
zbus = {version = "5", default-features = false, features = ["tokio"]}

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = {level = "deny", priority = -1}
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
nursery = {level = "warn", priority = -1}
panic = "deny"
pedantic = {level = "warn", priority = -1}
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
