[workspace]
members = ["crates/tug-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/andymai/tug"
rust-version = "1.95"
version = "0.3.0"

[workspace.dependencies]
dirs = "6"
http = "1"
mdm-engine = {git = "https://github.com/anefzaoui/misterdownloadmanager", rev = "8d2c73fcc33534c002631466b7e10db52796738b"}
mdm-labserver = {git = "https://github.com/anefzaoui/misterdownloadmanager", rev = "8d2c73fcc33534c002631466b7e10db52796738b"}
rusqlite = {version = "0.41", features = ["bundled"]}
tempfile = "3"
thiserror = "2"
tokio = {version = "1", features = ["macros", "rt-multi-thread", "sync", "time"]}
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = {level = "deny", priority = -1}
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
nursery = {level = "warn", priority = -1}
panic = "deny"
pedantic = {level = "warn", priority = -1}
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
