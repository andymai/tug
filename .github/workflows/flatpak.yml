name: Flatpak

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and upload to
        type: string
        required: true
    secrets:
      FLATPAK_SIGNING_KEY:
        description: The armored GPG secret key, without a passphrase, that signs the Flatpak repository
        # Not required, so a missing key fails only the repository, not the bundle.
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/flatpak.yml
      - packaging/**
      - scripts/flatpak-cargo.sh
      - scripts/flatpak-repo.sh
      - scripts/flatpak-repo-check.sh
      - scripts/flatpak-repo-test.sh
      - scripts/install-data.sh

permissions: {}

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: io.github.andymai.Tug.flatpak
          manifest-path: packaging/flatpak/io.github.andymai.Tug.yml
          # The action appends "-x86_64" to the key, and takes the newest cache whose key
          # starts with "flatpak-builder-x86_64": the Rust dependencies' build, kept by
          # scripts/flatpak-cargo.sh. Each run has a key of its own, so each run that saves gets one.
          # Only releases and manual runs save: a pull request's cache serves no one else.
          cache-key: flatpak-builder-x86_64-${{ github.run_id }}
          save-cache: ${{ inputs.tag != '' || github.event_name == 'workflow_dispatch' }}
      - name: Check that the Flatpak starts
        run: |
          set -euo pipefail
          if command -v dnf > /dev/null; then
            dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb > /dev/null
          else
            apt-get update > /dev/null && apt-get install -y --no-install-recommends xvfb > /dev/null
          fi
          flatpak install --user -y --noninteractive ./io.github.andymai.Tug.flatpak
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 2
          # The app must still be running when timeout stops it (exit 124).
          status=0
          dbus-run-session -- timeout 20 flatpak run io.github.andymai.Tug || status=$?
          [ "$status" -eq 124 ] || { echo "::error::the Flatpak exited early with $status"; exit 1; }
          test -f "$HOME/.var/app/io.github.andymai.Tug/data/io.github.andymai.Tug/tug.db"

  # Each release saves a Flatpak cache of about 800 MB under a key of its own, and GitHub
  # keeps 10 GB of caches for the repository: older ones would push out CI's Rust caches.
  # Only the ref that saved a cache, and the branches from it, restore that cache, so the
  # job deletes only the older caches of its own ref. A manual run on a branch keeps main's.
  prune:
    name: Keep the newest Flatpak cache of the ref
    needs: flatpak
    # The runs that save a cache: the same condition as save-cache above.
    if: inputs.tag || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: write # deletes the older caches
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key flatpak-builder-x86_64- \
            --sort created_at --order desc \
            --limit 100 --json key --jq '.[1:][].key' |
            while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY"; done

  upload:
    name: Upload the Flatpak
    needs: flatpak
    if: inputs.tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ./*.flatpak --clobber --repo "$GITHUB_REPOSITORY"

  # Tug's own Flatpak repository on GitHub Pages: after one `flatpak remote-add`,
  # Bazaar and other Flatpak stores list Tug and update it. A job of its own, so
  # the build's npm and cargo code never runs where the signing key is.
  repo:
    name: Flatpak repository
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      # flatpak-builder's own artifact name; a release run also holds the AppImage's.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: io.github.andymai.Tug-x86_64.flatpak
          path: bundle
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends flatpak ostree
      # A release signs with Tug's key, the one in tug-repo.asc: with another key, every
      # client that added the remote would refuse the update. Other runs sign with a
      # throwaway key and publish nothing.
      - name: Import the signing key
        env:
          TAG: ${{ inputs.tag }}
          KEY: ${{ inputs.tag && secrets.FLATPAK_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            gpg --batch --passphrase '' --quick-gen-key "Tug test key" rsa4096 sign never
            exit 0
          fi
          [ -n "$KEY" ] || { echo "::error::FLATPAK_SIGNING_KEY is empty"; exit 1; }
          printf '%s\n' "$KEY" | gpg --batch --import
          want=$(gpg --batch --show-keys --with-colons packaging/flatpak/tug-repo.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          gpg --batch --list-secret-keys --with-colons | grep -q "^fpr:*:$want:" ||
            { echo "::error::FLATPAK_SIGNING_KEY is not the key in packaging/flatpak/tug-repo.asc"; exit 1; }
      - run: scripts/flatpak-repo.sh bundle/io.github.andymai.Tug.flatpak site https://andymai.github.io/tug
      - run: scripts/flatpak-repo-check.sh site https://andymai.github.io/tug
      # The last two releases through the scripts, as two releases in a row would go.
      - name: Test an update from one release to the next
        if: ${{ !inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A new release exists before its bundle is up, so take the newest two that have one.
          mapfile -t tags < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[]
            | select((.draft or .prerelease) | not)
            | select(any(.assets[]; .name == "io.github.andymai.Tug.flatpak"))
            | .tag_name][:2][]')
          [ "${#tags[@]}" -eq 2 ] || { echo "::error::fewer than two releases have a Flatpak bundle"; exit 1; }
          for tag in "${tags[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern io.github.andymai.Tug.flatpak --dir "releases/$tag"
          done
          scripts/flatpak-repo-test.sh "releases/${tags[1]}/io.github.andymai.Tug.flatpak" \
            "releases/${tags[0]}/io.github.andymai.Tug.flatpak"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.tag
        with:
          path: site

  pages:
    name: Publish the Flatpak repository
    needs: [repo, upload]
    if: inputs.tag
    runs-on: ubuntu-24.04
    permissions:
      pages: write # the deployment
      id-token: write # the token that proves the deployment comes from this workflow
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
