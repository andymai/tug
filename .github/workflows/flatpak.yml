name: Flatpak

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and upload to
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/flatpak.yml
      - packaging/**

permissions: {}

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: io.github.andymai.Tug.flatpak
          manifest-path: packaging/flatpak/io.github.andymai.Tug.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Check that the Flatpak starts
        run: |
          set -euo pipefail
          if command -v dnf > /dev/null; then
            dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb > /dev/null
          else
            apt-get update > /dev/null && apt-get install -y --no-install-recommends xvfb > /dev/null
          fi
          flatpak install --user -y --noninteractive ./io.github.andymai.Tug.flatpak
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 2
          # The app must still be running when timeout stops it (exit 124).
          status=0
          dbus-run-session -- timeout 20 flatpak run io.github.andymai.Tug || status=$?
          [ "$status" -eq 124 ] || { echo "::error::the Flatpak exited early with $status"; exit 1; }
          test -f "$HOME/.var/app/io.github.andymai.Tug/data/io.github.andymai.Tug/tug.db"

  upload:
    name: Upload the Flatpak
    needs: flatpak
    if: inputs.tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ./*.flatpak --clobber --repo "$GITHUB_REPOSITORY"
