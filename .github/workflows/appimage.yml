name: AppImage

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and upload to
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/appimage.yml
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/src/browsers.rs
      - crates/tug-host/**
      - packaging/**
      - "!packaging/screenshots/**"
      - scripts/host/**

permissions: {}

jobs:
  appimage:
    name: AppImage
    # The oldest supported Ubuntu, so the AppImage needs only an older glibc.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @tug/desktop tauri build --bundles appimage
      - name: Check the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends desktop-file-utils xvfb
          image=$(ls target/release/bundle/appimage/*.AppImage)
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$image" --appimage-extract > /dev/null)
          desktop-file-validate "$RUNNER_TEMP"/squashfs-root/*.desktop
          # The app must still be running when timeout stops it (exit 124).
          status=0
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_CACHE_HOME="$RUNNER_TEMP/cache" \
            xvfb-run -a dbus-run-session -- timeout 15 "$image" || status=$?
          [ "$status" -eq 124 ] || { echo "::error::the AppImage exited early with $status"; exit 1; }
          test -f "$RUNNER_TEMP/data/io.github.andymai.Tug/tug.db"
          # The browser host lives in the AppImage's mount, which goes away when
          # it stops, so `tug browsers` must move it out and name the copy.
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.config/google-chrome"
          touch "$home/.config/google-chrome/Local State"
          mkdir -m 700 "$RUNNER_TEMP/runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          # A stand-in flatpak that grants Flatpak Chrome flatpak-spawn and writes down the
          # environment it got: the AppImage's own libraries must not reach host programs.
          mkdir -p "$home/.var/app/com.google.Chrome/config/google-chrome" "$RUNNER_TEMP/bin"
          touch "$home/.var/app/com.google.Chrome/config/google-chrome/Local State"
          printf '#!/bin/sh\nenv > "%s"\necho org.freedesktop.Flatpak=talk\n' "$RUNNER_TEMP/flatpak.env" > "$RUNNER_TEMP/bin/flatpak"
          chmod +x "$RUNNER_TEMP/bin/flatpak"
          HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$RUNNER_TEMP/data" PATH="$RUNNER_TEMP/bin:$PATH" \
            "$image" browsers | tee "$RUNNER_TEMP/browsers.txt"
          grep -q "^Google Chrome (Flatpak) *Registered$" "$RUNNER_TEMP/browsers.txt"
          appdir=$(sed -n "s/^APPDIR=//p" "$RUNNER_TEMP/flatpak.env")
          if [ -n "$appdir" ] && grep -q "^LD_LIBRARY_PATH=.*$appdir" "$RUNNER_TEMP/flatpak.env"; then
            echo "::error::flatpak got the AppImage's libraries: $(grep ^LD_LIBRARY_PATH= "$RUNNER_TEMP/flatpak.env")"
            exit 1
          fi
          host=$(jq -r .path "$home/.config/google-chrome/NativeMessagingHosts/io.github.andymai.tug.json")
          test "$host" = "$RUNNER_TEMP/data/io.github.andymai.Tug/host/tug-host"
          python3 scripts/host/talk.py "$host" '{"id":1,"type":"ping"}' | tee /dev/stderr | grep -q '"running": false'
          # A show starts the AppImage through the `tug` beside the host.
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_CACHE_HOME="$RUNNER_TEMP/cache" \
            xvfb-run -a dbus-run-session -- python3 scripts/host/talk.py "$host" '{"id":2,"type":"show"}' \
            | tee /dev/stderr | grep -q '"type": "shown"'
      - name: Upload to the release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$IMAGE" --clobber --repo "$GITHUB_REPOSITORY"
