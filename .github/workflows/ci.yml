name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on a PR; let every push to main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions: {}

# rust-toolchain.toml pins the Rust version and includes rustfmt and clippy,
# so rustup installs the right toolchain without a setup action.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.62.30
        with:
          tool: nextest
      - run: cargo nextest run --workspace
      # nextest does not run doctests, so they get their own step.
      - run: cargo test --workspace --doc
      # The test run regenerates the TypeScript bindings (ts-rs); committed ones must match.
      - name: Check the TypeScript bindings are current
        run: |
          git diff --exit-code -- apps/desktop/src/backend/bindings
          test -z "$(git status --porcelain -- apps/desktop/src/backend/bindings)"

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action's tag names the Rust version it installs; the toolchain is
      # set explicitly below.
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # 1.85.0
        with:
          toolchain: "1.95.0"
      - uses: ./.github/actions/setup
      - run: cargo +1.95.0 check --workspace --all-targets

  docs:
    name: Rustdoc
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deps:
    name: Dependency Rules
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-deps.py
      - run: python3 scripts/check-commands.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/gen-tokens.py --check
      - run: pnpm --filter @tug/desktop typecheck
      - run: pnpm --filter @tug/desktop lint
      - run: pnpm --filter @tug/desktop test
      - run: pnpm --filter @tug/desktop exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @tug/desktop test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: apps/desktop/.vitest/attachments
          retention-days: 7
      - run: pnpm --filter @tug/desktop build
      - run: pnpm --filter @tug/extension typecheck
      - run: pnpm --filter @tug/extension lint
      - run: pnpm --filter @tug/extension test
      - run: pnpm --filter @tug/extension build

  # A prebuilt cargo-audit: compiling it from source on the runner pulls the
  # newest releases of its dependencies, and one bad upstream publish then
  # fails every run.
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.62.30
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    name: Unused Dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.62.30
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  taplo:
    name: TOML Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install taplo
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.9.3/taplo-full-linux-x86_64.gz \
            | gunzip > "$HOME/.local/bin/taplo"
          chmod +x "$HOME/.local/bin/taplo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: taplo fmt --check

  # !cancelled() rather than always(): a run superseded by a newer push must
  # not report a failing gate for its commit.
  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
      - run: scripts/install-data.sh "$RUNNER_TEMP/prefix"
      - run: desktop-file-validate "$RUNNER_TEMP/prefix/share/applications/io.github.andymai.Tug.desktop"
      - run: appstreamcli validate --no-net --explain "$RUNNER_TEMP/prefix/share/metainfo/io.github.andymai.Tug.metainfo.xml"

  ci-pass:
    name: CI Pass
    if: ${{ !cancelled() }}
    needs: [fmt, clippy, test, msrv, docs, deps, frontend, deny, audit, machete, taplo, packaging]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
