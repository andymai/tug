name: Setup build environment
description: Install the libraries Tauri links against on Linux and restore the cargo cache

inputs:
  cache-key:
    description: Another job's id, to restore that job's cargo cache when this job builds the same targets
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Every workspace build compiles the desktop crate, whose Tauri backend links
    # WebKitGTK, GTK3, libsoup and the app indicator.
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        shared-key: ${{ inputs.cache-key }}
